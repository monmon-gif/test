<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="css/style.css">
</head>
<body class ="sunny">
    <div class="clouds">
    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>
    <div class="cloud cloud3"></div>
  </div>

  <div style="text-align:center; margin-top:50px;">
    <header>
      <h1>Weather Info</h1>
      <nav>
        <a href="index.html">Home</a> |
        <a href="weather.html">Weather</a> |
        <a href="about.html">About</a>
      </nav>

    <h1>住所から緯度・経度を検索</h1>
    <input type="text" id="address" placeholder="住所を入力してください">
    <button id="search">検索</button>

    <div id="result"></div>
      <input type="text" id="latitude" placeholder="緯度を入力">
      <input type="text" id="longitude" placeholder="経度を入力">
      <button id="getWeather">天気を取得</button>
      <div id="weather" class="weather-card" style="margin-top:20px;"></div>
  </div>

  <script src="js/weather.js"></script>
